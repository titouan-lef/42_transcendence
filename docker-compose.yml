services:
  backend:
    build: ./backend
    container_name: pong-backend
    env_file:
      - .env
    networks:
      - transcendence
    volumes: # mount local source code for dev
    - ./backend/src:/app/src
    restart: "no"   # dev: fail fast, do not restart

  frontend:
    build: ./frontend
    container_name: pong-frontend
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - transcendence
    volumes: # mount local source code for dev
    - ./frontend/src:/app/src
    - ./frontend/public:/app/public
    restart: "no"   # dev: fail fast, do not restart

  nginx:
    build: ./nginx
    container_name: pong-nginx
    ports:
      - "443:443"  # HTTPS
      - "80:80"    # optional: redirect HTTP → HTTPS
    depends_on:
      - backend
      - frontend
    networks:
      - transcendence
    restart: "on-failure"

networks:
  transcendence:
    name: transcendence
    driver: bridge
