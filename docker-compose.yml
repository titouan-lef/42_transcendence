services:
  backend:
    build:
      context: ./backend
      target: prod
    container_name: pong-backend
    env_file:
      - .backend_env
    networks:
      - transcendence
    volumes:
    - ./shared:/app/shared
    - ./backups:/app/backups
    restart: "on-failure"

  frontend:
    build:
      context: ./frontend
      target: prod
    container_name: pong-frontend
    env_file:
      - .frontend_env
    depends_on:
      - backend
    networks:
      - transcendence
    volumes:
    - ./shared:/app/shared
    restart: "on-failure"

  nginx:
    build: ./nginx
    container_name: pong-nginx
    ports:
      - "8888:443"  # Using 8888 because 42 computer are not allowed to bind 443. But with 443 on another computer or a VM will work
    depends_on:
      - backend
      - frontend
    networks:
      - transcendence
    restart: "on-failure"

networks:
  transcendence:
    name: transcendence
    driver: bridge
